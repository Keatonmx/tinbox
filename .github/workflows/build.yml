name: Build Tinbox

# Runs on GitHub's free macOS runners — the Mac you don't have.
#   • builds libmgba as an xcframework (cached between runs)
#   • compiles the app for the iOS Simulator and for devices
#   • boots a simulator, launches Tinbox, takes screenshots
#   • uploads an UNSIGNED .ipa you can sign + install from Windows with Sideloadly
#
# Optional: set a repository variable TEST_ROM_URL (Settings › Secrets and
# variables › Actions › Variables) pointing at a .gba/.zip you own; the
# simulator run then auto-opens it so the screenshot shows the core running.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # for the rolling "latest" release

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      SCHEME: Tinbox
      BUNDLE_ID: com.redfernsoutpost.tinbox
      DERIVED: ${{ github.workspace }}/DerivedData

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          xcodebuild -version
          cmake --version | head -n 1

      - name: Cache libmgba xcframework
        id: mgba-cache
        uses: actions/cache@v4
        with:
          path: Vendor/mgba-dist
          key: mgba-dist-${{ runner.os }}-${{ hashFiles('Scripts/build-mgba.sh', 'Scripts/mgba-ios.patch') }}-v1

      - name: Build libmgba (ios-arm64 + simulator)
        if: steps.mgba-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x Scripts/build-mgba.sh
          Scripts/build-mgba.sh 2>&1 | tee mgba-build.log
          ls -la Vendor/mgba-dist/mgba.xcframework

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tinbox.xcodeproj -scheme "$SCHEME" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee xcodebuild-simulator.log | (grep -E "error:|BUILD " || true)
          test -x "$DERIVED/Build/Products/Debug-iphonesimulator/Tinbox.app/Tinbox"

      - name: Simulator smoke test + screenshots
        continue-on-error: true
        env:
          TEST_ROM_URL: ${{ vars.TEST_ROM_URL }}
        run: |
          APP="$DERIVED/Build/Products/Debug-iphonesimulator/Tinbox.app"
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries[] | select(.key | contains("iOS")) | .value[]
            | select(.name | test("^iPhone (16|15) Pro$")) | .udid' | head -n 1)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available -j | jq -r '
              .devices | to_entries[] | select(.key | contains("iOS")) | .value[]
              | select(.name | test("^iPhone")) | .udid' | head -n 1)
          fi
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots

          # shot <name> [launch args…]: relaunch with the Debug-only arguments,
          # wait for the screen to settle, capture.
          shot() {
            local name="$1"; shift
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" "$@" > "screenshots/launch-$name.log" 2>&1
            sleep "${SHOT_DELAY:-8}"
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }

          # Fresh install, no ROMs.
          SHOT_DELAY=6 shot 01-library-empty

          # Drop a ROM into Documents/ROMs; everything after this has a game.
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          mkdir -p "$CONTAINER/Documents/ROMs"
          if [ -n "$TEST_ROM_URL" ]; then
            curl -fsSL "$TEST_ROM_URL" -o "$CONTAINER/Documents/ROMs/test-rom.${TEST_ROM_URL##*.}"
          else
            cp Tests/tinbox-test.gba "$CONTAINER/Documents/ROMs/Tinbox Test.gba"
          fi

          # In game (portrait), then a second frame a few seconds later.
          shot 02-ingame -tinbox-autoplay
          sleep 4
          xcrun simctl io "$UDID" screenshot screenshots/03-ingame-later.png

          SHOT_DELAY=9 shot 04-landscape -tinbox-autoplay -tinbox-landscape
          shot 05-themes -tinbox-theme Ember -tinbox-sheet themes
          shot 06-settings -tinbox-theme Midnight -tinbox-sheet settings
          shot 07-quickmenu -tinbox-autoplay -tinbox-sheet quickMenu

          # Rapid-tap layout check (portrait); -b in the accent press-glow style.
          SHOT_DELAY=7 shot 08-tapstorm-a -tinbox-autoplay -tinbox-tapstorm
          SHOT_DELAY=7 shot 08-tapstorm-b -tinbox-autoplay -tinbox-tapstorm -tinbox-glow accent

          # Every other screen (the game above has now been played, so the
          # Library shows its Continue card).
          SHOT_DELAY=6 shot 09-library
          SHOT_DELAY=6 shot 10-game-actions -tinbox-sheet gameActions
          shot 11-save-states -tinbox-autoplay -tinbox-sheet saveStates
          shot 12-cheats -tinbox-autoplay -tinbox-sheet cheats
          SHOT_DELAY=6 shot 13-skins -tinbox-sheet skins
          SHOT_DELAY=6 shot 14-settings-lower -tinbox-sheet settings -tinbox-sections Playback,Video,Controls,Appearance,Library,Connections,Advanced
          shot 15-settings-ingame -tinbox-autoplay -tinbox-sheet settings
          shot 16-game-overrides -tinbox-autoplay -tinbox-sheet gameOverrides
          SHOT_DELAY=6 shot 17-about -tinbox-sheet about
          shot 18-layout-editor -tinbox-autoplay -tinbox-sheet editLayout
          SHOT_DELAY=9 shot 19-landscape-quickmenu -tinbox-autoplay -tinbox-landscape -tinbox-sheet quickMenu
          SHOT_DELAY=6 shot 20-rom-folder -tinbox-sheet romFolder
          shot 21-layout-profiles -tinbox-autoplay -tinbox-sheet layoutProfiles
          SHOT_DELAY=6 shot 22-controllers -tinbox-sheet controllers
          SHOT_DELAY=6 shot 23-retroachievements -tinbox-sheet retroAchievements
          SHOT_DELAY=6 shot 24-library-outpost -tinbox-theme Outpost
          SHOT_DELAY=6 shot 25-library-tin -tinbox-theme Tin
          shot 26-ingame-tin -tinbox-theme Tin -tinbox-skin Surplus -tinbox-autoplay
          SHOT_DELAY=10 shot 27-time-capsule-intro -tinbox-autoplay -tinbox-sheet timeCapsule
          shot 28-cart-insert -tinbox-autoplay -tinbox-cart
          SHOT_DELAY=6 shot 29-glass-library -tinbox-theme Glass
          SHOT_DELAY=6 shot 30-glass-settings -tinbox-theme Glass -tinbox-sheet settings
          SHOT_DELAY=10 shot 27b-time-capsule -tinbox-autoplay -tinbox-sheet timeCapsule

          xcrun simctl spawn "$UDID" log show --last 120s --predicate 'process == "Tinbox"' > screenshots/device.log 2>/dev/null || true
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tinbox.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild-device.log | (grep -E "error:|BUILD " || true)
          APP="$DERIVED/Build/Products/Release-iphoneos/Tinbox.app"
          test -x "$APP/Tinbox"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Tinbox-unsigned.ipa Payload)
          ls -la Tinbox-unsigned.ipa

      - name: Upload IPA (sign with Sideloadly on Windows)
        uses: actions/upload-artifact@v4
        with:
          name: Tinbox-unsigned-ipa
          path: Tinbox-unsigned.ipa
          retention-days: 30

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Tinbox-unsigned.ipa "Tinbox-unsigned-build${{ github.run_number }}.ipa"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "Tinbox-unsigned-build${{ github.run_number }}.ipa" \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Unsigned IPA from ${{ github.sha }}. Sign and install with Sideloadly." \
            --latest

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            mgba-build.log
            xcodebuild-simulator.log
            xcodebuild-device.log
          if-no-files-found: ignore
