name: Release to TestFlight

# Signs the STORE edition and uploads it to App Store Connect / TestFlight,
# all on the rented macOS runner. Trigger manually from the Actions tab.
#
# Needs (Settings > Secrets and variables > Actions):
#   secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, DIST_P12_B64,
#            DIST_P12_PASSWORD, DIST_PROFILE_B64
#   variables: APPLE_TEAM_ID

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to upload (store is what review sees)"
        type: choice
        default: store
        options: [store, full]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SCHEME: Tinbox
      BUNDLE_ID: com.redfernsoutpost.tinbox
      DERIVED: ${{ github.workspace }}/DerivedData
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      PROFILE_NAME: Tinbox App Store

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Store uploads require the iOS 26 SDK: always take the newest Xcode.
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          xcodebuild -version

      - name: Cache libmgba xcframework
        id: mgba-cache
        uses: actions/cache@v4
        with:
          path: Vendor/mgba-dist
          key: mgba-dist-${{ runner.os }}-${{ hashFiles('Scripts/build-mgba.sh', 'Scripts/mgba-ios.patch') }}-v1

      - name: Build libmgba
        if: steps.mgba-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x Scripts/build-mgba.sh
          Scripts/build-mgba.sh 2>&1 | tail -n 20
          ls Vendor/mgba-dist/mgba.xcframework

      - name: Configure edition and build number
        run: |
          if [ "${{ inputs.edition }}" = "store" ]; then
            sed -i '' 's/static let store = false/static let store = true/' Tinbox/Edition.swift
            plutil -remove NSCameraUsageDescription Tinbox/Resources/Info.plist || true
            echo "Store edition configured"
          fi
          # Every upload needs a unique, increasing build number.
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" Tinbox/Resources/Info.plist
          plutil -p Tinbox/Resources/Info.plist | grep -E "CFBundleVersion|CFBundleShortVersion"

      - name: Install signing identity and profile
        env:
          DIST_P12_B64: ${{ secrets.DIST_P12_B64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          DIST_PROFILE_B64: ${{ secrets.DIST_PROFILE_B64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          echo "$DIST_P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$DIST_PROFILE_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/TinboxAppStore.mobileprovision"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive (signed)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Tinbox.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            -archivePath "$RUNNER_TEMP/Tinbox.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            2>&1 | tee xcodebuild-archive.log | (grep -E "error:|BUILD |ARCHIVE " || true)
          test -d "$RUNNER_TEMP/Tinbox.xcarchive"

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/export.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tinbox.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            2>&1 | (grep -E "error:|EXPORT " || true)
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 \
            || fastlane pilot upload --ipa "$RUNNER_TEMP"/export/*.ipa \
                 --api_key_path <(printf '{"key_id":"%s","issuer_id":"%s","key":%s}' \
                   "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$(python3 -c 'import json,os;print(json.dumps(os.environ["ASC_KEY_P8"]))')") \
                 --skip_waiting_for_build_processing true

      - name: Keep the signed IPA as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tinbox-signed-${{ inputs.edition }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
